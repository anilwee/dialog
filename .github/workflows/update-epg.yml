name: Update EPG File

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  update-epg:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install NordVPN
        run: |
          # Download and install NordVPN
          curl -s https://downloads.nordcdn.com/apps/linux/install.sh | sudo bash -s -- -p nordvpn-gui
          
          # Wait for installation
          sleep 5
          
          # Create group and add user
          sudo groupadd -f nordvpn
          sudo usermod -aG nordvpn $USER
          
          # Verify installation
          nordvpn --version

      - name: Login with token
        run: |
          echo "Logging in with token..."
          
          # Login using token (this is the reliable method)
          if sudo nordvpn login --token "${{ secrets.NORDVPN_TOKEN }}"; then
            echo "✅ Login successful"
          else
            echo "❌ Login failed"
            exit 1
          fi
          
          # Verify login
          sudo nordvpn account

      - name: Connect to Singapore server
        run: |
          echo "Connecting to Singapore..."
          
          # Connect to Singapore
          sudo nordvpn connect Singapore
          
          # Wait for connection
          sleep 10
          
          # Check connection
          sudo nordvpn status
          
          # Get connection details
          sudo nordvpn status | tee vpn-status.txt

      - name: Download EPG file through VPN
        id: download
        run: |
          # Create public directory
          mkdir -p public
          
          # Test connection
          echo "VPN IP: $(curl -s ifconfig.me)"
          
          # Try to download with multiple methods
          echo "Downloading EPG file..."
          
          # Method 1: wget with proper headers
          wget --timeout=30 \
               --tries=3 \
               --no-check-certificate \
               --user-agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
               --header="Accept: application/gzip,application/xml" \
               --header="Accept-Language: en-US,en;q=0.9" \
               --header="Connection: keep-alive" \
               -O public/epg.xml.gz \
               https://watch.livecricketsl.xyz/epg/epg.xml.gz || \
          # Method 2: curl with extended options
          curl -L --connect-timeout 30 \
               --max-time 60 \
               --retry 3 \
               --retry-delay 5 \
               -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36" \
               -H "Accept: application/gzip,application/xml" \
               -o public/epg.xml.gz \
               https://watch.livecricketsl.xyz/epg/epg.xml.gz
          
          # Check download
          if [ -f public/epg.xml.gz ] && [ -s public/epg.xml.gz ]; then
            FILE_SIZE=$(du -h public/epg.xml.gz | cut -f1)
            echo "✅ File downloaded successfully (Size: $FILE_SIZE)"
            
            # Extract the file
            gunzip -f public/epg.xml.gz
            echo "✅ File extracted to epg.xml"
            
            # Create success metadata
            cat > public/epg-info.json << EOF
            {
              "status": "success",
              "timestamp": "$(date -Iseconds)",
              "file_size": "$FILE_SIZE",
              "vpn_server": "$(sudo nordvpn status | grep -i server | cut -d: -f2 | xargs)",
              "download_method": "wget/curl"
            }
            EOF
            
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ Download failed"
            
            # Check if it's a 403 error
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://watch.livecricketsl.xyz/epg/epg.xml.gz)
            
            cat > public/epg-status.json << EOF
            {
              "status": "failed",
              "error": "HTTP $HTTP_CODE",
              "timestamp": "$(date -Iseconds)",
              "vpn_ip": "$(curl -s ifconfig.me)",
              "vpn_server": "$(sudo nordvpn status | grep -i server | cut -d: -f2 | xargs || echo 'Unknown')"
            }
            EOF
            
            echo "status=failed" >> $GITHUB_OUTPUT
          fi

      - name: Cleanup and disconnect
        if: always()
        run: |
          # Disconnect VPN
          sudo nordvpn disconnect
          
          # Logout
          sudo nordvpn logout
          
          echo "✅ VPN disconnected and logged out"

      - name: Commit and push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add public/
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update EPG files - $(date +'%Y-%m-%d')"
            git push
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: epg-files
          path: |
            public/
            vpn-status.txt
          retention-days: 7
