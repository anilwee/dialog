name: Download EPG XML Data

on:
  schedule:
    # 1:00 AM NZT - runs at 12:00 UTC
    # During NZDT (daylight): 1:00 AM NZDT
    # During NZST (standard): 12:00 AM NZST
    - cron: '0 12 * * *'
  
  # Manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  download-epg:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install requests
      
      - name: Create open folder if it doesn't exist
        run: |
          mkdir -p open
      
      - name: Run EPG download script
        run: python download_epg.py
      
      - name: Commit and push if epg.xml changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add open/epg.xml
          git diff --quiet && git diff --staged --quiet || git commit -m "Update EPG data in open folder [skip ci]"
          git push
