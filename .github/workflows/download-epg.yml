name: Download EPG XML Data

on:
  schedule:
    # 1:00 AM NZT (UTC+12) = 13:00 UTC previous day? Let me clarify:
    # NZT (Standard) = UTC+12 → 1:00 AM NZT = 13:00 UTC previous day
    # Example: Jan 2, 1:00 AM NZT = Jan 1, 13:00 UTC
    
    # Using NZST (UTC+12, non-daylight savings time)
    - cron: '13 12 * * *'   # 12:13? No, let me correct
    
    # CORRECT: For 1:00 AM NZST (UTC+12) → 13:00 UTC previous day
    # But cron doesn't support "previous day" easily
    
    # SIMPLER SOLUTION: Run at 12:00 UTC 
    # In UTC+12 (NZT standard), 12:00 UTC = 12:00 AM NZT (midnight)
    # In UTC+13 (NZDT daylight), 12:00 UTC = 1:00 AM NZDT ✅
    
    - cron: '0 12 * * *'   # 12:00 UTC daily
    
    # This means:
    # - During Daylight Saving (UTC+13): Runs at 1:00 AM NZDT
    # - During Standard Time (UTC+12): Runs at 12:00 AM NZST
  
  # Alternative if you want to schedule specifically for 1:00 AM NZST (non-DST only):
  # - cron: '0 13 * * *'   # 13:00 UTC = 1:00 AM NZST (standard time only)
  
  # Manual trigger
  workflow_dispatch:

jobs:
  download-epg:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install requests
      
      - name: Run EPG download script
        run: python download_epg.py
      
      - name: Commit and push if epg.xml changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add epg.xml
          git diff --quiet && git diff --staged --quiet || git commit -m "Update EPG data [skip ci]"
          git push
