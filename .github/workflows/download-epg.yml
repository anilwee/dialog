name: Download and Process EPG XML Data

##on:
  schedule:
    # Runs at 12:00 UTC daily (1:00 AM NZDT, 12:00 AM NZST)
    - cron: '0 12 * * *'
  
  # Manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  download-and-process-epg:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4
      
      - name: Create open and logo folders if they don't exist
        run: |
          mkdir -p open
          mkdir -p logo
      
      - name: Download EPG XML
        run: python download_epg.py
        continue-on-error: false
      
      - name: Generate LCN mapping from LyngSat
        run: python generate_lcn_mapping.py
        continue-on-error: true  # Don't fail if LyngSat is unreachable
      
      - name: Generate EPG with channel logos
        run: python generate_epg_with_logos.py
        continue-on-error: false
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add open/epg.xml logo/ 2>/dev/null || true
          git add dialog_lcn_map.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Update EPG data with channel organization [skip ci]" || echo "No changes to commit"
          git push || echo "Nothing to push or push failed"
