name: Download and Process EPG XML Data

on:
  schedule:
    # Runs at 12:00 UTC daily (1:00 AM NZDT, 12:00 AM NZST)
    - cron: '0 12 * * *'
  
  # Manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  download-and-process-epg:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4
      
      - name: Create open folder if it doesn't exist
        run: |
          mkdir -p open
      
      - name: Download EPG XML
        run: python download_epg.py
      
      - name: Generate LCN mapping from LyngSat
        run: python generate_lcn_mapping.py
      
      - name: Generate EPG with channel logos
        run: python generate_epg_with_logos.py
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add open/epg.xml dialog_lcn_map.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update EPG data with channel organization [skip ci]"
          git push
