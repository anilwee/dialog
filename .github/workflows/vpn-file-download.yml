name: VPN Connect and File Host

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *'

jobs:
  vpn-download-host:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup VPN Config
      run: |
        mkdir -p /tmp/vpn_config
        # Just decode the OVPN_FILE - use it as-is
        echo "${{ secrets.OVPN_FILE }}" | base64 -d > /tmp/vpn_config/config.ovpn
        printf "%s\n" "${{ secrets.VPN_USERNAME }}" "${{ secrets.VPN_PASSWORD }}" > /tmp/vpn_config/auth.txt
        chmod 600 /tmp/vpn_config/*

    - name: Install OpenVPN
      run: sudo apt-get update && sudo apt-get install -y openvpn

    - name: Connect VPN
      run: |
        cd /tmp/vpn_config
        sudo openvpn --config config.ovpn --auth-user-pass auth.txt --daemon
        sleep 20

    - name: Download EPG Files
      run: |
        wget -O epg.xml.gz https://watch.livecricketsl.xyz/epg/epg.xml.gz
        gunzip -c epg.xml.gz > epg.xml

    - name: Update Public Files
      run: |
        mkdir -p public
        mv epg.xml epg.xml.gz public/

    - name: Commit and Push
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        git add public/
        git commit -m "Update EPG files" || echo "No changes to commit"
        git push

    - name: Cleanup
      run: |
        sudo pkill openvpn || true
        rm -rf /tmp/vpn_config
