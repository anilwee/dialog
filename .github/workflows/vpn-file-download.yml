name: VPN Connect and File Host

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *'

jobs:
  vpn-download-host:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup VPN Config
      run: |
        mkdir -p /tmp/vpn_config
        echo "${{ secrets.OVPN_FILE }}" | base64 -d > /tmp/vpn_config/config.ovpn
        echo "${{ secrets.OVPN_CA }}" | base64 -d > /tmp/vpn_config/ca.crt
        echo "${{ secrets.OVPN_TLS_AUTH }}" | base64 -d > /tmp/vpn_config/ta.key
        printf "%s\n" "${{ secrets.VPN_USERNAME }}" "${{ secrets.VPN_PASSWORD }}" > /tmp/vpn_config/auth.txt
        chmod 600 /tmp/vpn_config/auth.txt /tmp/vpn_config/ca.crt /tmp/vpn_config/ta.key

    - name: Debug Files
      run: |
        echo "=== Checking VPN files ==="
        ls -la /tmp/vpn_config/
        echo "=== Config content ==="
        cat /tmp/vpn_config/config.ovpn

    - name: Install OpenVPN
      run: sudo apt-get update && sudo apt-get install -y openvpn

    - name: Test VPN Connection
      run: |
        cd /tmp/vpn_config
        timeout 30s sudo openvpn --config config.ovpn --auth-user-pass auth.txt --verb 3 || echo "VPN test completed"

    - name: Connect VPN
      run: |
        cd /tmp/vpn_config
        sudo openvpn --config config.ovpn --auth-user-pass auth.txt --daemon
        sleep 15

    - name: Download EPG Files
      run: |
        wget -O epg.xml.gz https://watch.livecricketsl.xyz/epg/epg.xml.gz && \
        gunzip -c epg.xml.gz > epg.xml || echo "Download failed"

    - name: Update Public Files
      run: |
        mkdir -p public
        mv epg.xml epg.xml.gz public/ 2>/dev/null || echo "No files to move"
        ls -la public/

    - name: Commit and Push
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        git add public/ || echo "No files to add"
        git diff --staged --quiet || git commit -m "Update EPG files"
        git push

    - name: Cleanup
      run: |
        sudo pkill openvpn || true
        rm -rf /tmp/vpn_config
